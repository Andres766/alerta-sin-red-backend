name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Base desechable para las pruebas de integración (tests/integration).
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: alerta
          POSTGRES_PASSWORD: alerta
          POSTGRES_DB: alerta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alerta -d alerta_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://alerta:alerta@localhost:5432/alerta_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff (estilo y reglas de seguridad)
        run: ruff check .

      - name: Pytest (unitarias, API e integración con PostGIS)
        run: pytest -rs

  docker:
    name: Construir imagen
    runs-on: ubuntu-latest
    needs: calidad
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t alerta-sin-red-api .
