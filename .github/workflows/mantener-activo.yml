name: Mantener activo

# La instancia gratuita de Render se apaga tras 15 min sin tráfico, y mientras
# duerme no corre la evaluación programada ni responde rápido a la PWA.
# Una petición ligera cada 10 minutos la mantiene despierta.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Si la instancia estaba dormida, el primer intento puede agotar el tiempo
      # mientras arranca: se reintenta en lugar de marcar el trabajo como fallido.
      - name: Petición de salud
        run: |
          curl -sS -o /dev/null -w "health -> %{http_code} en %{time_total}s\n" \
            --fail --max-time 100 --retry 4 --retry-delay 15 --retry-all-errors \
            https://alerta-sin-red-api.onrender.com/api/v1/health
